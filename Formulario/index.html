<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Encuesta</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 id="title">Formulario de Encuesta</h1>
    <p id="description">Por favor completa este formulario con tu información.</p>


    <form id="survey-form">
      <label id="name-label" for="name">Nombre:</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Ingresa tu nombre"
        required
      />

      <label id="email-label" for="email">Correo electrónico:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Ingresa tu correo"
        required
      />

      <label id="number-label" for="number">Edad:</label>
      <input
        type="number"
        id="number"
        name="age"
        min="10"
        max="99"
        placeholder="Edad"
      />

      <label for="dropdown">¿Cómo conociste este sitio?</label>
      <select id="dropdown" name="source">
        <option value="">Selecciona una opción</option>
        <option value="amigo">Por un amigo</option>
        <option value="web">Buscando en la web</option>
      </select>

      <p>¿Recomendarías este sitio?</p>
      <label>
        <input type="radio" name="recommend" value="si" /> Sí
      </label>
      <label>
        <input type="radio" name="recommend" value="no" /> No
      </label>

      <p>¿Qué te gustaría mejorar?</p>
      <label>
        <input type="checkbox" value="diseño" /> Diseño
      </label>
      <label>
        <input type="checkbox" value="contenido" /> Contenido
      </label>
      <label>
        <input type="checkbox" value="funcionalidad" /> Funcionalidad
      </label>

      <label for="comments">Comentarios:</label>
      <textarea
        id="comments"
        name="comments"
        placeholder="Escribe aquí tus comentarios..."
      ></textarea>

      <button id="submit" type="submit">Enviar</button>
    </form>
  </body>
</html>
